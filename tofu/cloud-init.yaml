#cloud-config
hostname: ${hostname}
users:
  - default
  - name: ubuntu
    ssh_authorized_keys:
      - ${ssh_key}
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
ssh_pwauth: false
disable_root: true
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - jq
  - nfs-common
  - containerd
  - apt-transport-https
runcmd:
    - swapoff -a
    - sed -i '/ swap / s/^/#/' /etc/fstab
    - |
      cat >> /etc/sysctl.conf <<'EOF'
      # Required for Kubernetes networking (iptables-based kube-proxy)
      net.bridge.bridge-nf-call-iptables=1
      net.bridge.bridge-nf-call-ip6tables=1
      # Enable IP forwarding for pod networking
      net.ipv4.ip_forward=1
      # Allow memory overcommit for container runtime
      vm.overcommit_memory=1
      # Reduce swap usage preference for container workloads
      vm.swappiness=10
      EOF
    - sysctl --system
    - mkdir -p /etc/containerd
    - containerd config default > /etc/containerd/config.toml
    - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
    - systemctl restart containerd
    - systemctl enable --now containerd
    - mkdir -p /etc/apt/keyrings
    - curl -fSL --proto =https --tlsv1.2 https://pkgs.k8s.io/core:/stable:/v${kubernetes_version}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-archive-keyring.gpg
    - echo "deb [signed-by=/etc/apt/keyrings/kubernetes-archive-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v${kubernetes_version}/deb/ /" > /etc/apt/sources.list.d/kubernetes.list
    - apt-get update
    - crictl config runtime-endpoint unix:///var/run/containerd/containerd.sock
