#cloud-config
hostname: ${hostname}
users:
  - default
  - name: ubuntu
    ssh_authorized_keys:
      - ${ssh_key}
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
ssh_pwauth: false
disable_root: true
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - jq
  - nfs-common
  - containerd
runcmd:
  - swapoff -a
  - sed -i '/ swap / s/^/#/' /etc/fstab
  - sysctl -w net.bridge.bridge-nf-call-iptables=1
  - sysctl -w net.bridge.bridge-nf-call-ip6tables=1
  - sysctl -w net.ipv4.ip_forward=1
  - sysctl -w vm.overcommit_memory=1
  - sysctl -w vm.swappiness=10
  - echo 'vm.overcommit_memory = 1' >> /etc/sysctl.conf
  - echo 'vm.swappiness = 10' >> /etc/sysctl.conf
  - systemctl enable --now containerd
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-archive-keyring.gpg
  - echo "deb [signed-by=/etc/apt/keyrings/kubernetes-archive-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /" > /etc/apt/sources.list.d/kubernetes.list
  - apt-get update
  - apt-get install -y kubelet kubeadm kubectl
  - apt-mark hold kubelet kubeadm kubectl
  - crictl config runtime-endpoint unix:///var/run/containerd/containerd.sock
  - kubeadm config images pull --cri-socket unix:///var/run/containerd/containerd.sock
