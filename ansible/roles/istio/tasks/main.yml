---
- name: Install Istio service mesh
  hosts: k8s_master
  become: true
  vars:
    istio_version: "1.22.0"
    istio_chart_url: "https://istio-release.storage.googleapis.com/charts"
  tasks:
    - name: Download Istio release
      ansible.builtin.get_url:
        url: "https://github.com/istio/istio/releases/download/{{ istio_version }}/istio-{{ istio_version }}-linux-amd64.tar.gz"
        dest: /tmp/istio.tar.gz
        mode: '0644'

    - name: Extract Istio
      ansible.builtin.unarchive:
        src: /tmp/istio.tar.gz
        dest: /tmp
        remote_src: yes
        creates: /tmp/istio-{{ istio_version }}/bin/istioctl

    - name: Install istioctl
      ansible.builtin.copy:
        src: /tmp/istio-{{ istio_version }}/bin/istioctl
        dest: /usr/local/bin/istioctl
        mode: '0755'
        remote_src: yes

    - name: Verify istioctl installation
      ansible.builtin.command: istioctl version --remote=false
      register: istio_version_check
      changed_when: false

    - name: Add Istio Helm repository
      ansible.builtin.command: >
        helm repo add istio {{ istio_chart_url }}
      register: istio_repo_add
      changed_when: "'added' in istio_repo_add.stdout or 'already exists' in istio_repo_add.stdout"
      failed_when: false

    - name: Update Helm repositories
      ansible.builtin.command: helm repo update
      changed_when: true

    - name: Create istio-system namespace
      ansible.builtin.command: kubectl create namespace istio-system --dry-run=client -o yaml | kubectl apply -f -
      changed_when: true
      run_once: true

    - name: Install Istio base (CRDs and cluster-wide resources)
      ansible.builtin.command: >
        helm upgrade --install istio-base istio/base -n istio-system
        --set defaultRevision=default
        --wait --timeout 5m
      register: istio_base
      changed_when: "'Release' in istio_base.stdout or 'upgraded' in istio_base.stdout"
      run_once: true

    - name: Install Istiod (control plane)
      ansible.builtin.command: >
        helm upgrade --install istiod istio/istiod -n istio-system
        --wait --timeout 5m
      register: istiod
      changed_when: "'Release' in istiod.stdout or 'upgraded' in istiod.stdout"
      run_once: true

    - name: Create Kiali namespace
      ansible.builtin.command: kubectl create namespace kiali --dry-run=client -o yaml | kubectl apply -f -
      changed_when: true
      run_once: true

    - name: Install Kiali with Istio dashboard
      ansible.builtin.command: >
        helm upgrade --install kiali-server istio/kiali-server -n kiali
        --set auth.strategy=anonymous
        --set istioNamespace=istio-system
        --set externalUrl=http://{{ hostvars[groups['k8s_master'][0]].ansible_host }}:20001
        --wait --timeout 5m
      register: kiali
      changed_when: "'Release' in kiali.stdout or 'upgraded' in kiali.stdout"
      run_once: true

    - name: Label namespace for sidecar injection
      ansible.builtin.command: >
        kubectl label namespace {{ item }} istio-injection=enabled --overwrite
      loop:
        - default
        - moodle-prod
        - moodle-staging
      run_once: true
