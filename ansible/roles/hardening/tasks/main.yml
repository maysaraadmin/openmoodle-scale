---
- name: Harden Ubuntu nodes
  hosts: all
  become: true
  vars:
    ssh_port: 22
    allowed_ssh_users: [ubuntu]
    ufw_rules:
      - { port: '{{ ssh_port }}', proto: tcp, rule: allow, comment: 'SSH' }
      - { port: '6443', proto: tcp, rule: allow, comment: 'Kubernetes API' }
      - { port: '10250', proto: tcp, rule: allow, comment: 'Kubelet API' }
      - { port: '2379:2380', proto: tcp, rule: allow, comment: 'etcd' }
      - { port: '8472', proto: udp, rule: allow, comment: 'Flannel VXLAN' }
      - { port: '4789', proto: udp, rule: allow, comment: 'Calico VXLAN' }
      - { port: '179', proto: tcp, rule: allow, comment: 'Calico BGP' }
      - { port: '30000:32767', proto: tcp, rule: allow, comment: 'NodePort range' }
  tasks:
    - name: Disable password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        validate: sshd -t -f %s

    - name: Disable root SSH login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        validate: sshd -t -f %s

    - name: Reload sshd
      ansible.builtin.service:
        name: sshd
        state: reloaded

    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present

    - name: Enable automatic security updates
      ansible.builtin.copy:
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::AutocleanInterval "7";
          APT::Periodic::Unattended-Upgrade "1";
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: '0644'

    - name: Install UFW
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Configure UFW defaults
      ansible.builtin.ufw:
        direction: incoming
        policy: deny

    - name: Allow required ports through UFW
      ansible.builtin.ufw:
        rule: "{{ item.rule }}"
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
        comment: "{{ item.comment }}"
      loop: "{{ ufw_rules }}"

    - name: Enable UFW
      ansible.builtin.ufw:
        state: enabled
