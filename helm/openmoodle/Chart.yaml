apiVersion: v2
name: openmoodle
description: Scalable open-source Moodle deployment
type: application
version: 1.0.0
appVersion: "4.4"
keywords:
  - moodle
  - lms
  - education
  - kubernetes
maintainers:
  - name: OpenMoodleScale
sources:
  - https://github.com/moodle/moodle
dependencies:
  - name: redis-cluster
    version: 13.0.4
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: mariadb
    version: 15.0.0
    repository: https://charts.bitnami.com/bitnami
    condition: mariadb.enabled
  - name: minio
    version: 12.0.0
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
