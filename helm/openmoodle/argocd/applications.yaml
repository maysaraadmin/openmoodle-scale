apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openmoodle-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/openmoodle-scale.git
    targetRevision: main
    path: helm/openmoodle
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      parameters:
        - name: moodle.image.tag
          value: "4.4.0"
        - name: moodle.nginx.tag
          value: "4.4.0"
  destination:
    server: https://kubernetes.default.svc
    namespace: moodle-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
---
