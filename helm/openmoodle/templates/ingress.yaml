{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "openmoodle.fullname" . }}
  annotations: {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend: { service: { name: {{ include "openmoodle.fullname" $ }}, port: { number: 80 } } }
          {{- end }}
    {{- end }}
  {{- if not .Values.ingress.tls }}
  {{- fail "ingress.tls must be configured when ingress.enabled is true" }}
  {{- else }}
  tls: {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}