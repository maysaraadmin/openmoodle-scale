apiVersion: v1
{{- if .Values.secrets.create }}
kind: Secret
metadata:
  name: {{ include "openmoodle.fullname" . }}-secrets
type: Opaque
stringData:
  database-password: {{ required "secrets.databasePassword is required when secrets.create is true" .Values.secrets.databasePassword | quote }}
  admin-password: {{ required "secrets.adminPassword is required when secrets.create is true" .Values.secrets.adminPassword | quote }}
  minio-access-key: {{ .Values.secrets.minioAccessKey | quote }}
  minio-secret-key: {{ .Values.secrets.minioSecretKey | quote }}
{{- end }}