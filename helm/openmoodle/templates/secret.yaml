apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openmoodle.fullname" . }}-secrets
type: Opaque
stringData:
  database-password: {{ .Values.secrets.databasePassword | quote }}
  admin-password: {{ .Values.secrets.adminPassword | quote }}
  minio-access-key: {{ .Values.secrets.minioAccessKey | quote }}
  minio-secret-key: {{ .Values.secrets.minioSecretKey | quote }}