apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "openmoodle.fullname" . }}-moodledata
spec:
  accessModes: [{{ .Values.moodledata.accessMode }}]
  storageClassName: {{ .Values.global.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.moodledata.size }}