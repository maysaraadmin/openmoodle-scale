apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openmoodle.fullname" . }}
  labels: {{- include "openmoodle.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.moodle.replicaCount }}
  selector:
    matchLabels:
      {{- include "openmoodle.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openmoodle.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.podManagement.terminationGracePeriodSeconds | default 60 }}
      securityContext:
        seccompProfile: { type: RuntimeDefault }
        fsGroup: 33
      {{- if .Values.moodle.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.moodle.imagePullSecrets | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.moodle.image.repository }}:{{ .Values.moodle.image.tag }}"
          imagePullPolicy: {{ .Values.moodle.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for database at {{ include "openmoodle.databaseHost" . }}..."
              for i in $(seq 1 60); do
                if php -r 'new PDO("mysql:host={{ include "openmoodle.databaseHost" . }}","{{ .Values.database.user }}",getenv("DB_PASSWORD"),"{{ .Values.database.name }}");' 2>/dev/null; then
                  echo "Database is ready."
                  exit 0
                fi
                echo "Retrying in 2s... ($i/60)"
                sleep 2
              done
              echo "Database not ready after 120s, failing."
              exit 1
          env:
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: {{ include "openmoodle.secretName" . }}, key: database-password } } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "openmoodle.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
      containers:
        - name: moodle-app
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.moodle.image.repository }}:{{ .Values.moodle.image.tag }}"
          imagePullPolicy: {{ .Values.moodle.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          ports: [{ name: fastcgi, containerPort: 9000 }]
          startupProbe:
            tcpSocket: { port: fastcgi }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket: { port: fastcgi }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: fastcgi }
            initialDelaySeconds: 30
            periodSeconds: 20
          lifecycle:
            {{- if .Values.preStopHook.enabled }}
            preStop:
              exec:
                command: ["/bin/sh", "-c", "echo 'Graceful shutdown: sending QUIT to PHP-FPM'; kill -QUIT 1 2>/dev/null || true; sleep {{ .Values.preStopHook.timeoutSeconds | default 30 }}"]
            {{- end }}
          env:
            - { name: DB_HOST, value: {{ include "openmoodle.databaseHost" . | quote }} }
            - { name: DB_NAME, value: {{ .Values.database.name | quote }} }
            - { name: DB_USER, value: {{ .Values.database.user | quote }} }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "openmoodle.secretName" . }}, key: database-password } }
            - name: DB_PASS
              valueFrom: { secretKeyRef: { name: {{ include "openmoodle.secretName" . }}, key: database-password } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "openmoodle.secretName" . }}, key: redis-password } }
            {{- if .Values.fileStorage.enabled }}
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ include "openmoodle.secretName" . }}, key: s3-access-key } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ include "openmoodle.secretName" . }}, key: s3-secret-key } }
            {{- end }}
          volumeMounts:
            - { name: moodledata, mountPath: /var/moodledata }
            - { name: config, mountPath: /var/www/html/config.php, subPath: config.php, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          resources: {{- toYaml .Values.moodle.resources | nindent 12 }}
        - name: moodle-web
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.moodle.nginx.repository }}:{{ .Values.moodle.nginx.tag }}"
          imagePullPolicy: {{ .Values.moodle.nginx.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: {{ .Values.readinessProbe.path | default "/health" }}, port: {{ .Values.readinessProbe.port | default "http" }} }
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold | default 3 }}
          livenessProbe:
            httpGet: { path: {{ .Values.livenessProbe.path | default "/health" }}, port: {{ .Values.livenessProbe.port | default "http" }} }
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds | default 20 }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold | default 6 }}
          lifecycle:
            {{- if .Values.preStopHook.enabled }}
            preStop:
              exec:
                command: ["/bin/sh", "-c", "echo 'Graceful shutdown: stopping nginx'; nginx -s quit; sleep {{ .Values.preStopHook.timeoutSeconds | default 30 }}"]
            {{- end }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: moodledata
          persistentVolumeClaim: { claimName: {{ include "openmoodle.fullname" . }}-moodledata }
        - name: config
          configMap: { name: {{ include("openmoodle.fullname", .) }}-config }
          readOnly: true
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
