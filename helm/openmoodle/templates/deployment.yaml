apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openmoodle.fullname" . }}
  labels: {{- include "openmoodle.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.moodle.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ include "openmoodle.name" . }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ include "openmoodle.name" . }} }
    spec:
      containers:
        - name: moodle-app
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.moodle.image.repository }}:{{ .Values.moodle.image.tag }}"
          ports: [{ name: fastcgi, containerPort: 9000 }]
          env:
            - { name: DB_HOST, value: {{ .Values.database.host | quote }} }
            - { name: DB_NAME, value: {{ .Values.database.name | quote }} }
            - { name: DB_USER, value: {{ .Values.database.user | quote }} }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "openmoodle.fullname" . }}-secrets, key: database-password } }
            - name: DB_PASS
              valueFrom: { secretKeyRef: { name: {{ include "openmoodle.fullname" . }}-secrets, key: database-password } }
          volumeMounts:
            - { name: moodledata, mountPath: /var/moodledata }
            - { name: config, mountPath: /var/www/html/config.php, subPath: config.php }
          resources: {{- toYaml .Values.moodle.resources | nindent 12 }}
        - name: moodle-web
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.moodle.nginx.repository }}:{{ .Values.moodle.nginx.tag }}"
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: moodledata
          persistentVolumeClaim: { claimName: {{ include "openmoodle.fullname" . }}-moodledata }
        - name: config
          configMap: { name: {{ include "openmoodle.fullname" . }}-config }