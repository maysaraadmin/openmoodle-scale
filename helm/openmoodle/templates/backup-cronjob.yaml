{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "openmoodle.fullname" . }}-backup
  labels: {{- include "openmoodle.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | default "0 2 * * *" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: {{ include "openmoodle.fullname" . }}-backup
          restartPolicy: OnFailure
          securityContext:
            seccompProfile: { type: RuntimeDefault }
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
      containers:
        - name: backup
          image: "bitnami/kubectl:latest"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          command:
            - /bin/sh
            - -c
            - |
              set -e
              BACKUP_DIR="/backup/openmoodle-$(date +%Y%m%d-%H%M%S)"
              NAMESPACE="{{ .Release.Namespace }}"
              DB_POD=$(kubectl get pod -n "$NAMESPACE" -l app.kubernetes.io/name=mariadb -o jsonpath='{.items[0].metadata.name}')
              APP_POD=$(kubectl get pod -n "$NAMESPACE" -l app.kubernetes.io/name={{ include "openmoodle.name" . }} -o jsonpath='{.items[0].metadata.name}')
              SECRET_NAME="{{ include "openmoodle.secretName" . }}"
              DB_PASSWORD=$(kubectl get secret -n "$NAMESPACE" "$SECRET_NAME" -o jsonpath='{.data.database-password}' | base64 -d)

              mkdir -p "$BACKUP_DIR"
              kubectl get all -n "$NAMESPACE" -o yaml > "$BACKUP_DIR/k8s-resources.yaml"
              kubectl get configmap -n "$NAMESPACE" -o yaml > "$BACKUP_DIR/configmaps.yaml"

              kubectl exec -n "$NAMESPACE" "$DB_POD" -- \
                sh -c 'mariadb-dump --single-transaction --routines --events \
                  -u "${DB_USER:-moodle}" -p"${DB_PASSWORD}" "${DB_NAME:-moodle}"' \
                > "$BACKUP_DIR/database.sql"

              kubectl exec -n "$NAMESPACE" "$APP_POD" -- \
                tar czf - -C /var moodledata \
                > "$BACKUP_DIR/moodledata.tar.gz"

              tar czf "${BACKUP_DIR}.tar.gz" -C "$(dirname "$BACKUP_DIR")" "$(basename "$BACKUP_DIR")"
              rm -rf "$BACKUP_DIR"

              echo "Backup created at ${BACKUP_DIR}.tar.gz"

              {{- if .Values.backup.minio.enabled }}
              echo "MinIO upload requires mc client; use manual backup scripts for offsite storage or configure an external sync job."
              {{- end }}

              {{- if .Values.backup.retention.enabled }}
              find /backup -name "openmoodle-*.tar.gz" -mtime +{{ .Values.backup.retention.days | default 30 }} -delete
              echo "Retention cleanup applied"
              {{- end }}
          env:
            - name: DB_USER
              value: {{ .Values.database.user | quote }}
            - name: DB_NAME
              value: {{ .Values.database.name | quote }}
            {{- if .Values.backup.minio.enabled }}
            - name: MINIO_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ include "openmoodle.secretName" . }}, key: minio-access-key } }
            - name: MINIO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ include "openmoodle.secretName" . }}, key: minio-secret-key } }
            {{- end }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          volumes:
            - name: tmp
              emptyDir: {}
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 1Gi }
{{- end }}