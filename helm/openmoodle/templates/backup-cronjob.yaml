{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "openmoodle.fullname" . }}-backup
  labels: {{- include "openmoodle.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | default "0 2 * * *" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: {{ include "openmoodle.fullname" . }}-backup
          restartPolicy: OnFailure
          securityContext:
            seccompProfile: { type: RuntimeDefault }
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
            - name: backup
              image: {{ .Values.backup.image | default "bitnami/kubectl:1.30" }}
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsNonRoot: true
                runAsUser: 1001
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
                readOnlyRootFilesystem: true
              command: ["/bin/sh", "-c", "cp /scripts/backup.sh /tmp/backup.sh && sh /tmp/backup.sh"]
              env:
                - name: DB_USER
                  value: {{ .Values.database.user | quote }}
                - name: DB_NAME
                  value: {{ .Values.database.name | quote }}
                - name: MAINTENANCE_MODE
                  value: {{ .Values.backup.maintenance | quote }}
                {{- if .Values.backup.encryption.enabled }}
                - name: BACKUP_ENCRYPTION_KEY
                  valueFrom: { secretKeyRef: { name: {{ include "openmoodle.secretName" . }}, key: backup-encryption-key } }
                {{- end }}
                {{- if .Values.backup.minio.enabled }}
                - name: MINIO_ENDPOINT
                  value: {{ .Values.backup.minio.endpoint | default "minio.minio.svc.cluster.local:9000" | quote }}
                - name: MINIO_BUCKET
                  value: {{ .Values.backup.minio.bucket | default "backups" | quote }}
                - name: MINIO_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-minio, key: root-user, optional: true } }
                - name: MINIO_SECRET_KEY
                  valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-minio, key: root-password, optional: true } }
                {{- end }}
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
                - { name: backup, mountPath: /backup }
                - { name: scripts, mountPath: /scripts, readOnly: true }
              volumes:
                - name: tmp
                  emptyDir: {}
                - name: backup
                  persistentVolumeClaim: { claimName: {{ include "openmoodle.fullname" . }}-backup }
                - name: scripts
                  configMap: { name: {{ include "openmoodle.fullname" . }}-backup-script, defaultMode: 0755 }
              resources:
                requests: { cpu: 200m, memory: 256Mi }
                limits: { cpu: 1000m, memory: 1Gi }
{{- end }}
