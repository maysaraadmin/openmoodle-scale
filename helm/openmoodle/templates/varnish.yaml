{{- if .Values.varnish.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openmoodle.fullname" . }}-varnish
spec:
  replicas: {{ .Values.varnish.replicaCount }}
  selector: { matchLabels: { app: {{ include "openmoodle.fullname" . }}-varnish } }
  template:
    metadata: { labels: { app: {{ include "openmoodle.fullname" . }}-varnish } }
    spec:
      containers:
        - name: varnish
          image: varnish:7.4.2-alpine
          ports: [{ name: http, containerPort: 8080 }]
          command:
            - varnishd
            - -F
            - -f
            - /etc/varnish/default.vcl
            - -s
            - malloc,{{ .Values.varnish.cacheSize }}
            - -a
            - :8080
            - -T
            - :6082
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          env:
            - { name: HOME, value: /tmp }
          volumeMounts:
            - { name: vcl, mountPath: /etc/varnish, readOnly: true }
            - { name: varnish-lib, mountPath: /var/lib/varnish }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:
              cpu: 1000m
              memory: {{ .Values.varnish.memoryLimit | upper }}
      volumes:
        - name: vcl
          configMap: { name: {{ include "openmoodle.fullname" . }}-varnish }
        - name: varnish-lib
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openmoodle.fullname" . }}-varnish
data:
  default.vcl: |
    vcl 4.1;
    backend default { .host = "{{ include "openmoodle.fullname" . }}"; .port = "80"; }
    sub vcl_recv {
      if (req.http.Cookie ~ "MoodleSession") { return (pass); }
      if (req.url ~ "\.(css|js|png|jpg|jpeg|gif|svg|woff2)$") { unset req.http.Cookie; }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openmoodle.fullname" . }}-varnish
spec:
  selector: { app: {{ include "openmoodle.fullname" . }}-varnish }
  ports: [{ port: 80, targetPort: http }]
{{- end }}
