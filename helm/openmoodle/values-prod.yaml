global:
  storageClass: longhorn
  imageRegistry: registry.openmoodle.local

moodle:
  replicaCount: 5
  image: { repository: openmoodle/moodle-app, tag: "4.4.0", pullPolicy: IfNotPresent }
  nginx: { repository: openmoodle/moodle-nginx, tag: "4.4.0", pullPolicy: IfNotPresent }
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: 2000m, memory: 4Gi }

hpa:
  enabled: true
  minReplicas: 5
  maxReplicas: 50
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

database: { host: "", name: moodle, user: moodle, port: 3306 }

secrets:
  existingSecret: moodle-prod-secrets
  create: false

redis:
  enabled: true
  host: ""
  cluster: true
  pdb:
    enabled: true
    minAvailable: 1
  auth:
    enabled: true
    password: ""

mariadb:
  enabled: true
  architecture: replication
  pdb:
    enabled: true
    minAvailable: 1
  primary:
    persistence: { enabled: true, size: 100Gi }
    resources:
      requests: { cpu: 2000m, memory: 4Gi }
      limits: { cpu: 4000m, memory: 8Gi }
    antiAffinity: true
  secondary:
    replicaCount: 2
    persistence: { enabled: true, size: 100Gi }
    resources:
      requests: { cpu: 1000m, memory: 2Gi }
      limits: { cpu: 2000m, memory: 4Gi }

minio:
  enabled: true
  accessKey: ""
  secretKey: ""

moodledata:
  size: 500Gi
  accessMode: ReadWriteMany

cache:
  enabled: true
  redis:
    host: ""
    port: 6379
    database: 1
    ttl: 120

fileStorage:
  enabled: true
  s3:
    host: ""
    bucket: moodledata-prod
    accessKey: ""
    secretKey: ""
    region: us-east-1
    useSSL: true

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: moodle.example.com
      paths: [{ path: /, pathType: Prefix }]
  tls:
    - hosts:
        - moodle.example.com
      secretName: moodle-tls
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod

cron: { enabled: true, schedule: "*/5 * * * *" }

varnish: { enabled: true, replicaCount: 3, cacheSize: 4G }

livenessProbe:
  path: /health
  port: http
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  path: /health
  port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

preStopHook:
  enabled: true
  timeoutSeconds: 30

monitoring:
  enabled: true
  serviceMonitor: { enabled: true, interval: 15s }

networkPolicy:
  enabled: true
  ingressNamespaceSelector:
    kubernetes.io/metadata.name: ingress-nginx

backup:
  enabled: true
  schedule: "0 2 * * *"
  minio:
    enabled: true
    endpoint: minio.minio.svc.cluster.local:9000
    bucket: backups
  retention:
    enabled: true
    days: 30
  encryption:
    enabled: true

podManagement:
  terminationGracePeriodSeconds: 120

initJob:
  enabled: true
