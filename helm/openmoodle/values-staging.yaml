global:
  storageClass: longhorn
  imageRegistry: registry.openmoodle.local

moodle:
  replicaCount: 2
  image: { repository: openmoodle/moodle-app, tag: "4.4.0", pullPolicy: IfNotPresent }
  nginx: { repository: openmoodle/moodle-nginx, tag: "4.4.0", pullPolicy: IfNotPresent }

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5

database: { host: "", name: moodle_staging, user: moodle, port: 3306 }

secrets:
  existingSecret: ""
  create: false
  databasePassword: ""
  adminPassword: ""
  minioAccessKey: ""
  minioSecretKey: ""
  redisPassword: ""

redis:
  enabled: true
  host: ""
  cluster: true
  auth:
    enabled: true
    password: ""

mariadb:
  enabled: true
  architecture: replication
  primary: { persistence: { enabled: true, size: 10Gi } }
  secondary: { replicaCount: 1, persistence: { enabled: true, size: 10Gi } }

minio:
  enabled: true
  accessKey: ""
  secretKey: ""

moodledata:
  size: 50Gi
  accessMode: ReadWriteOnce

cache:
  enabled: true
  redis:
    host: ""
    port: 6379
    database: 1
    ttl: 120

fileStorage:
  enabled: false
  s3:
    host: ""
    bucket: moodledata-staging
    accessKey: ""
    secretKey: ""
    region: us-east-1
    useSSL: true

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: moodle-staging.example.com
      paths: [{ path: /, pathType: Prefix }]
  tls: []
  annotations: {}

cron: { enabled: true, schedule: "*/5 * * * *" }

varnish: { enabled: false, replicaCount: 2, cacheSize: 2G }

livenessProbe:
  path: /health
  port: http
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  path: /health
  port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

preStopHook:
  enabled: true
  timeoutSeconds: 30

monitoring:
  enabled: true
  serviceMonitor: { enabled: true, interval: 30s }

networkPolicy:
  enabled: true
  ingressNamespaceSelector:
    kubernetes.io/metadata.name: ingress-nginx

backup:
  enabled: true
  schedule: "0 2 * * *"
  minio:
    enabled: true
    endpoint: minio.minio.svc.cluster.local:9000
    bucket: backups-staging
  retention:
    enabled: true
    days: 14

podManagement:
  terminationGracePeriodSeconds: 60

initJob:
  enabled: true
