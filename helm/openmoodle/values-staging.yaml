global:
  storageClass: longhorn
  imageRegistry: registry.openmoodle.local

moodle:
  replicaCount: 2
  image: { repository: openmoodle/moodle-app, tag: "4.4.0", pullPolicy: IfNotPresent }
  nginx: { repository: openmoodle/moodle-nginx, tag: "4.4.0", pullPolicy: IfNotPresent }

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5

database: { host: "", name: moodle_staging, user: moodle, port: 5432, type: pgsql }

secrets:
  existingSecret: ""
  create: false
  minioAccessKey: ""
  minioSecretKey: ""
  redisPassword: ""

redis:
  enabled: true
  host: ""
  cluster: true
  pdb:
    enabled: true
    minAvailable: 1
  auth:
    enabled: true
    password: ""

postgresql:
  enabled: true
  architecture: standalone
  auth:
    username: moodle
    database: moodle_staging
    password: ""
  primary:
    persistence: { enabled: true, size: 10Gi }
    antiAffinity: true
  pdb:
    enabled: true
    minAvailable: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

minio:
  enabled: true
  accessKey: ""
  secretKey: ""

moodledata:
  size: 50Gi
  accessMode: ReadWriteMany

cache:
  enabled: true
  redis:
    host: ""
    port: 6379
    database: 1
    ttl: 120

fileStorage:
  enabled: false
  s3:
    host: ""
    bucket: moodledata-staging
    accessKey: ""
    secretKey: ""
    region: us-east-1
    useSSL: true
    publicBucket: false

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: moodle-staging.example.com
      paths: [{ path: /, pathType: Prefix }]
  tls: []
  annotations: {}

cron: { enabled: true, schedule: "*/5 * * * *" }

varnish: { enabled: false, replicaCount: 2, cacheSize: 2G, memoryLimit: "3Gi" }

livenessProbe:
  path: /health
  port: http
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  path: /health
  port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

preStopHook:
  enabled: true
  timeoutSeconds: 30

monitoring:
  enabled: true
  serviceMonitor: { enabled: true, interval: 30s }

networkPolicy:
  enabled: true
  ingressNamespaceSelector:
    kubernetes.io/metadata.name: ingress-nginx

backup:
  enabled: true
  schedule: "0 2 * * *"
  image: "bitnami/kubectl:1.30"
  persistent: true
  storageClass: longhorn
  size: 20Gi
  minio:
    enabled: true
    endpoint: minio.minio.svc.cluster.local:9000
    bucket: backups-staging
  retention:
    enabled: true
    days: 14
  encryption:
    enabled: false
  maintenance: false

podManagement:
  terminationGracePeriodSeconds: 60

initJob:
  enabled: true
