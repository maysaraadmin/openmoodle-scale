global:
  storageClass: longhorn
  imageRegistry: registry.openmoodle.local

moodle:
  replicaCount: 3
  image: { repository: openmoodle/moodle-app, tag: "4.4.0", pullPolicy: IfNotPresent }
  nginx: { repository: openmoodle/moodle-nginx, tag: "4.4.0", pullPolicy: IfNotPresent }
  imagePullSecrets: []
  nodeSelector:
    kubernetes.io/role: worker
  priorityClassName: production-critical
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: 2000m, memory: 4Gi }

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

database: { host: "", name: moodle, user: moodle, port: 5432, type: pgsql }

secrets:
  existingSecret: ""
  create: false
  minioAccessKey: ""
  minioSecretKey: ""
  redisPassword: ""
  backupEncryptionKey: ""

redis:
  enabled: true
  host: ""
  cluster: true
  pdb:
    enabled: true
    minAvailable: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  auth:
    enabled: true
    password: ""
  commonConfiguration: |-
    maxmemory 2gb
    maxmemory-policy allkeys-lru

postgresql:
  enabled: true
  architecture: standalone
  auth:
    username: moodle
    database: moodle
    password: ""
  primary:
    persistence: { enabled: true, size: 20Gi }
    resources:
      requests: { cpu: 2000m, memory: 4Gi }
      limits: { cpu: 4000m, memory: 8Gi }
  pdb:
    enabled: true
    minAvailable: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

minio:
  enabled: true
  accessKey: ""
  secretKey: ""

moodledata:
  size: 100Gi
  accessMode: ReadWriteMany

cache:
  enabled: true
  redis:
    host: ""
    port: 6379
    database: 1
    ttl: 120

fileStorage:
  enabled: false
  s3:
    host: ""
    bucket: moodledata
    accessKey: ""
    secretKey: ""
    region: us-east-1
    useSSL: true
    publicBucket: false

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: moodle.openmoodle.local
      paths: [{ path: /, pathType: Prefix }]
  tls: []
  annotations: {}
  certManager:
    enabled: false
    issuerName: letsencrypt-prod
    issuerKind: ClusterIssuer

cron: { enabled: true, schedule: "*/5 * * * *" }

varnish: { enabled: false, replicaCount: 2, cacheSize: 2G, memoryLimit: "3Gi" }

livenessProbe:
  path: /health
  port: http
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  path: /health
  port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

preStopHook:
  enabled: true
  timeoutSeconds: 30

initJob:
  enabled: true

monitoring:
  enabled: true
  serviceMonitor: { enabled: true, interval: 30s }

networkPolicy:
  enabled: true
  s3Cidr: "52.216.0.0/15"
  ingressNamespaceSelector:
    kubernetes.io/metadata.name: ingress-nginx

backup:
  enabled: false
  schedule: "0 2 * * *"
  image: "bitnami/kubectl:1.30"
  persistent: true
  storageClass: ""
  size: 20Gi
  minio:
    enabled: false
    endpoint: minio.minio.svc.cluster.local:9000
    bucket: backups
  retention:
    enabled: true
    days: 30
  encryption:
    enabled: false
    gpgKeyId: ""
  maintenance: false

istio:
  enabled: false
  sidecar:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 2000m
        memory: 1Gi

kiali:
  enabled: false
  auth:
    strategy: anonymous
  externalUrl: "http://localhost:20001"

podManagement:
  terminationGracePeriodSeconds: 60
